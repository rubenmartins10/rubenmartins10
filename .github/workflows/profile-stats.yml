name: GitHub Stats & 3D Calendar

on:
  schedule:
    - cron: "0 0 * * *" # Corre todos os dias à meia-noite
  workflow_dispatch:      # Permite correr manualmente

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # MUDANÇA AQUI: Removemos o 'base: ""' que estava a dar erro
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Lisbon
          config_theme: dark
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

  build-3d-contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated stats" || echo "Nada para guardar"
          git push
