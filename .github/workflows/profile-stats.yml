name: GitHub Stats & 3D Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: "" # Limpa o texto todo (tira o header, activity, etc.)
          config_timezone: Europe/Lisbon
          config_theme: dark
          
          # CONFIGURAÇÃO DE SEGURANÇA PARA NÃO DAR ERRO
          plugin_habits: yes
          plugin_habits_from: 200       # Analisa mais eventos (200) para garantir que tem dados
          plugin_habits_days: 14        # Últimos 14 dias
          plugin_habits_facts: yes      # Ativa os factos (ajuda a evitar o erro visual)
          plugin_habits_charts: yes     # Ativa o gráfico

  build-3d-contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated stats" || echo "Nada para guardar"
          git push
